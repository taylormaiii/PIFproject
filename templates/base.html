
<!DOCTYPE html>
<html lang="en" style="color-scheme: dark; background-color: #111827;">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='07km9n8k-9rw4.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bba922d03b528091.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='content_script.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='3c9f9bd2a030d0fc.css') }}">
<style>
        .flexbox {
            display: flex;
            align-items: stretch;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        .section1 {
            flex: 1 1 50%;
            width: auto;
            float: none;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #1f2d2d;
            color: #f3f4f6;
            padding: 5px;
        }
        .section1 > div {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .section1 > div > div {
            flex: 1 1 auto;
            min-height: 0;
            max-height: none;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .section1 table {
            width: 100%;
            min-width: 0;
            table-layout: fixed;
        }
        .section1 td,
        .section1 th {
            min-width: 0;
            box-sizing: border-box;
        }
        .section2 {
            flex: 1 1 50%;
            width: auto;
            background-color: rgb(40, 101, 141);
            padding: 5px;
        }
        td, th {
            border-radius: 15px;
            border: 1px solid #000000;
            text-align: left;
            padding: 8px;
        }
        .encounter-inputs {
            display: flex;
            flex-direction: row;
        }
        .pokemon-input {
            width: 140px;
            max-width: 100%;
            box-sizing: border-box;
        }
        .encounter-inputs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }
        .dropdown {
            position: relative;
        }

        .dropbtn {
            background-color: #2e382f;
            color: white;
            padding: 5px;
            border: none;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            padding: 0;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            font-size: inherit;
            min-width: 100%;
            box-sizing: border-box;
        }

        .dropdown-content a {
            color: black;
            padding: 5px 5px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            background-color: #3e8e41;
        }

        .dropdown-content button {
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            border: 0;
            text-align: left;
        }
        .mons-in-box {
            display:grid;
            grid-template-columns: auto auto auto;
            background-color: white;
            grid-template-columns: repeat(8,minmax(0,1fr));
            gap: .5rem;
        }
        .mons-in-box div {
            background: #ffffff;
            border: 1px solid black;
            padding: .375rem;
            border-width: 1px;
            overflow: visible;
            align-items: center;
            flex-direction: column;
            display: flex;
            position: relative;
        }
        .fused-possible {
            background: black;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-columns: repeat(8,minmax(0,1fr));
        }
        .fused-possible div {
            display: flex;
            position: relative;
            width: 100%;
            overflow: visible;
            flex-direction: column;
            margin-left: auto;
            margin-right: auto;
            flex-wrap: wrap;
            justify-content: center;
            gap: .375rem;
            box-sizing: border-box;
            color: white;
        }
        .fused-type-solo {
            width: 48;
            height: 16;
            color: transparent;
        }
        .fused-type-duo {
            width: 48;
            height: 16;
            color: transparent;
        }
        .spriteimg {
            border: 1px solid black;
            padding: .375rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .spriteimg div {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
        }
        .spriteimg img {
            display: block;
            margin: 0 auto;
        }
        button {
            background-color: gray;
            padding: 4px;
            border-radius: 5px;
        }
    </style>
</head>
<body class="antialiased font-sans">
<main id="main-content" class="max-w-[1500px] mx-auto">
    <div class="flexbox">
        <section1 class="section1">
            <h2 id="locations-heading" class="sr-only">Game Locations</h2>
            <div class="overflow-hidden 2xl:rounded-lg border-y md:border border-gray-700 xl:shadow-sm" style="border-color: #374151;">
                <div class="overflow-auto scrollbar-thin overscroll-x-none relative" style="background-color: #111827;">
                    <table class="w-full min-w-full table-fixed divide-y divide-gray-700 overscroll-x-contain overscroll-y-auto" style="background-color: #111827; color: #f3f4f6;" data-scroll-container="true" aria-label="Locations table" aria-rowcount="100">
                        <colgroup>
                            <col width="20%">
                            <col width="15%">
                            <col width="45%">
                            <col width="20%">
                        </colgroup>
                        <thead class="bg-gray-800 sticky top-0 z-50 shadow-[0_0.5px_0_0_rgb(55,65,81)]" style="background-color: #1f2937; color: #d1d5db;">
                            <tr>
                                <th class="sticky top-0 z-20 bg-gray-800 px-4 py-3 text-left text-xs text-gray-300 uppercase tracking-wider transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-inset w-[125px]" style="background-color: #1f2937; color: #d1d5db;"><div class="flex items-center space-x-1"><div class="flex items-center w-full"><span>Location</span></div></div></th>
                                <th class="sticky top-0 z-20 bg-gray-800 px-4 py-3 text-left text-xs text-gray-300 uppercase tracking-wider transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-inset w-[125px]" style="background-color: #1f2937; color: #d1d5db;"><div class="flex items-center space-x-1"><div class="flex items-center w-full"><span>Sprite</span></div></div></th>
                                <th class="sticky top-0 z-20 bg-gray-800 px-4 py-3 text-left text-xs text-gray-300 uppercase tracking-wider transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-inset w-[125px]" style="background-color: #1f2937; color: #d1d5db;"><div class="flex items-center space-x-1"><div class="flex items-center w-full"><span>Encounter</span></div></div></th>
                                <th class="sticky top-0 z-20 bg-gray-800 px-4 py-3 text-left text-xs text-gray-300 uppercase tracking-wider transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-inset w-[125px]" style="background-color: #1f2937; color: #d1d5db;"><div class="flex items-center space-x-1"><div class="flex items-center w-full"><span>Status</span></div></div></th>
                            </tr>
                        </thead>
                        <tbody id="location-table" class="bg-gray-900 divide-y divide-gray-700" style="background-color: #111827; color: #f3f4f6;">
                            {% for location in locations %}
                            <tr data-location-id="{{ location.id }}" aria-rowindex="{{ loop.index + 1 }}" class="h-location-row hover:bg-gray-800/60 transition-colors group/row" style="background-color: #111827; color: #f3f4f6;">
                                <td id="locations" class="px-4 py-3 whitespace-nowrap text-sm text-gray-100" style="color: #f3f4f6;">
                                    <div class="text-white flex gap-x-2 items-center" style="color: #f3f4f6;">
                                        <h2 class="text-sm truncate rounded-md focus-within:ring-2 focus-within:ring-blue-400 focus-within:ring-offset-0.5 break-words block" style="color: #f3f4f6;">{{ location.name }}</h2>
                                    </div>
                                </td>
                                <td id="sprites" class="p-1 whitespace-nowrap text-sm text-gray-100 relative group" style="color: #f3f4f6;">
                                    <div class="text-white spriteimg flex gap-x-2 items-center" style="color: #f3f4f6;"></div>
                                </td>
                                <td id="Pokemon" class="w-full overflow-x-auto px-4 pt-8.5 pb-4 text-sm text-gray-100" style="color: #f3f4f6;">
                                    <div class="encounter-container">
                                        <div class="encounter-inputs">
                                            <div class="relative dropdown encounter-input">
                                                <input class="pokemon-input" type="text" list="pokemon-options-{{ loop.index }}"/>
                                            </div>
                                        </div>
                                        <button type="button" onclick="onClickAdd(this)" class="fuse-button"> Fuse </button>
                                        <datalist id="pokemon-options-{{ loop.index }}" name="headbody">
                                            {% for mon in pokemon_data %}
                                                <option
                                                    value="{{ mon.name }}"
                                                    data-pokemon-id="{{ mon.id }}">
                                                </option>
                                            {% endfor %}
                                        </datalist>
                                    </div>
                                </td>
                                <td id="status" class="p-2 whitespace-nowrap text-sm text-gray-100" style="color: #f3f4f6;">
                                    <div class="flex flex-col items-center justify-center gap-1 group-hover/row:opacity-100 transition-opacity duration-200 group-focus-within/row:opacity-100">
                                        <div class="flex">
                                            <div class="relative dropdown" data-headlessui-state="">
                                                    <label for="select-status-{{ loop.index }}" margin="auto" vertical-align="center";>Status</label>
                                                    <select class="status-select" id="select-status-{{ loop.index }}">
                                                        <option>Select</option>
                                                        <option value="caught">Caught</option>
                                                        <option value="missed">Missed</option>
                                                        <option value="dead">Deceased</option>
                                                    </select>
                                                    <div class="flex">
                                                        <button type="button" class="clear-row" onclick="onClickDel(this)"> Clear Encounter </button>
                                                    </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                </table>
                </div>
            </div>
        </section1>
        <section2 class="section2" width="390px">
            <h2>Fusion Box</h2>
            <div width="100%" margin-bottom=".75rem;">
                <button type="button" class="clear-box">Clear Box</button>
            </div>
            <div class="pc-box min-h-0 flex-1 overflow-y-auto overflow-x-hidden overscroll-y-contain pr-1 pt-[5px] [-webkit-overflow-scrolling:touch]" padding-bottom="5px">
                <div class="box-selector"></div>
                <div class="box-info"></div>
                <div class="mons-in-box relative mx-auto flex grid-cols-3 gap-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 w-full max-w-[1000px] flex-col rounded-lg border border-border bg-card text-card-foreground shadow-sm">
                    <span></span>
                </div>
            </div>
            <div class="fused-possible flex-1 mx-auto w-full max-w-none px-2 sm:px-3 md:px-5 overflow-y-auto overflow-x-hidden">
                
            </div>
        </section2>
</div>
</main>

<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>

</html>
